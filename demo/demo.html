<!DOCTYPE html>
<html lang="en">
 
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="../css/demo.css">
    <title>WeeModel - puzzle demo</title>
    <style>
        body {
            margin: 0;
        }
    </style>
 
    <script type="module" src="./demo.js"></script>
 
</head>
 
<body>
 
    <div id="scene"></div>
 
    <div id="ui">
        <div class="overlay-edge overlay-top">
            <button type="button" class="infoButton russo-one-regular">
                <img src="/assets/ListIcon.png" alt="list icon" class="infoIcon">
                INFO
            </button>
            <button type="button" class="phoneToggleButton russo-one-regular"
                aria-controls="phonePanel" aria-expanded="false">
                PHONE
            </button>
        </div>
        <div class="overlay-edge overlay-right"></div>
        <div class="overlay-edge overlay-bottom"></div>
        <div class="overlay-edge overlay-left"></div>
 
        <div class="overlay-content">
            <div class="infoBox russo-one-regular">
                <div class="infoBoxTitle">Missing Puzzle Piece</div>
                <div class="goals">Main Goal: Fill Hollow Space
                    <ul class="goalsList">
                        <li>Rotate Shape</li>
                        <li>Translate Shape</li>
                        <li>Move Shape into Hollow</li>
                    </ul>
                </div>
                <div class="controlsBox">
                    <div class="controlsTitle">Controls</div>
                    <div class="controlsList">
                        <div class="controlsListRow">
                            <div class="funcButton">T</div>
                            <div>Translation</div>
                        </div>
                        <div class="controlsListRow">
                            <div class="funcButton">R</div>
                            <div>Rotation</div>
                        </div>
                        <div class="controlsListRow">
                            <div class="funcButton">S</div>
                            <div>Scaling</div>
                        </div>
                        <div class="controlsListRow">
                            <div class="funcButton">C</div>
                            <div>Camera</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
 
        <!-- Phone panel: mirrors the cube's rotation -->
        <aside class="phone-panel russo-one-regular" id="phonePanel"
            aria-label="Phone mirroring the cube's rotation" hidden>
            <div class="phone-title">
                <span class="phone-drag-handle">Phone</span>
                <button type="button" class="phoneCloseButton" aria-label="Close phone panel">
                    &times;
                </button>
            </div>
            <div id="phoneCanvas" class="phone-canvas"></div>
            <div class="phone-readout">
                <span class="axis axis-x">X <b id="phoneX">0°</b></span>
                <span class="axis axis-y">Y <b id="phoneY">0°</b></span>
                <span class="axis axis-z">Z <b id="phoneZ">0°</b></span>
            </div>
        </aside>
    </div>
 
</body>
 
</html>

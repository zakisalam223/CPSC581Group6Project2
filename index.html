<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="./css/index.css">
    <title>WeeModel</title>
    <script type="module" src="./main.js"></script>

</head>

<body>

    <div class="screenOuterBox">
        <div class="screenInnerBox" id="screen" data-state="title">
            <div class="screenContent" id="titleScreen">
                <h1 class="press-start-2p titleHeading">WeeModel</h1>
                <div class="playerContainer">
                    <div class="playerReady1">
                        <h2 class="press-start-2p apprenticeHeading">Apprentice</h2>
                        <img src="./assets/ready-up/novice.png" alt="novice">
                        <button type="button" data-ready aria-pressed="false">Not ready</button>
                    </div>

                    <div class="playerReady2">
                        <h2 class="press-start-2p gameMasterHeading">Game Master</h2>
                        <img src="./assets/ready-up/game-master.png" alt="novice" style="transform: scaleX(-1);">
                        <button type="button" data-ready aria-pressed="false">Not ready</button>
                    </div>
                </div>
            </div>

            <div class="loadingScreen" id="loadingScreen" hidden aria-live="polite">
                <p class="press-start-2p">Loading...</p>
            </div>
        </div>

        <div class = "russo-one-regular">
            3D Expertise Sharing Online
        </div>
    </div>

    <!-- <h1>Ready Up Page - in progress...</h1>
    <button id="puzzleBtn">Go to Puzzle Page</button>
    <button id="notReadyYetBtn">Ready?</button>
    <button id="readyBtn">Ready!</button> -->

</body>
</html>

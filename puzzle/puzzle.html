<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/puzzle.css">
    <title>WeeModel - puzzle</title>
    <style>
        body {
            margin: 0;
        }
    </style>

    <script type="module" src="./puzzle.js"></script>

</head>

<body>

    <div id="scene"></div>

    <!-- NOVICE MAIN -->
    <div id="ui-main">
        <div class="overlay-edge main-overlay-top">
            <div class="main-overlay-top-left">
                <button type="button" class="infoBtn russo-one-regular">
                    <img src="/assets/ListIcon.png" alt="list icon" class="infoIcon">
                    INFO
                </button>

                <div class="timer russo-one-regular">
                    <input type="number" id="hour" min="0" value="00" step="1" placeholder="hh" readonly></input>
                    <h2 class="colon"> : </h2>
                    <input type="number" id="min" min="0" value="00" step="1" placeholder="mm" readonly></input>
                    <h2 class="colon"> : </h2>
                    <input type="number" id="sec" min="0" value="00" step="1" placeholder="ss" readonly></input>
                </div>

                <div class="modeUI">
                    <h2>Mode: <span id="mode-text">Camera</span></h2>
                </div>
            </div>

            <button type="button" class="helpBtn russo-one-regular">
                <img src="/assets/BellIcon.png" alt="bell icon" class="helpIcon">
                HELP
            </button>
        </div>
        <div class="overlay-edge main-overlay-right"></div>
        <div class="overlay-edge main-overlay-bottom"></div>
        <div class="overlay-edge main-overlay-left"></div>

        <div class="main-overlay-content">
            <!-- Info Box -->
            <div class="infoBox russo-one-regular">
                <div class="infoBoxTitle">Missing Puzzle Piece</div>
                <div class="goals">Main Goal: Fill Hollow Space
                    <div class="goalsList">
                        <label class="goal">Rotate Shape
                            <input type="checkbox" id="goal1">
                            <span class="checkmark"></span>
                        </label>

                        <label class="goal">Translate Shape
                            <input type="checkbox" id="goal2">
                            <span class="checkmark"></span>
                        </label>

                        <label class="goal">Move Shape into Hollow
                            <input type="checkbox" id="goal3">
                            <span class="checkmark"></span>
                        </label>
                    </div>
                </div>
                <div class="controlsBox">
                    <div class="controlsTitle">Controls</div>
                    <div class="controlsList">
                        <div class="controlsListRow">
                            <div class="funcKeys">T</div>
                            <div>Translation</div>
                        </div>
                        <div class="controlsListRow">
                            <div class="funcKeys">R</div>
                            <div>Rotation</div>
                        </div>
                        <div class="controlsListRow">
                            <div class="funcKeys">S</div>
                            <div>Scaling</div>
                        </div>
                        <div class="controlsListRow">
                            <div class="funcKeys">C</div>
                            <div>Camera</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Goal Pop-up -->
            <div class="goalPopup goal russo-one-regular">
                <div class="goalPopupText"></div>
                <img src="/assets/Check.png" alt="check">
            </div>
        </div>
    </div>

    <!-- LEVEL COMPLETE -->
    <div id="ui-level-complete">
        <div class="overlay-edge lc-overlay-top"></div>
        <div class="overlay-edge lc-overlay-right">
            <div class="completeContainer">
                <div class="completeTitle">Complete!</div>
                <div class="taskBox">
                    <img src="/assets/StarIcon.png" alt="star icon" class="taskIcon">
                    Translate cube
                </div>
                <div class="taskBox">
                    <img src="/assets/StarIcon.png" alt="star icon" class="taskIcon">
                    Rotate cube
                </div>
                <div class="taskBox">
                    <img src="/assets/StarIcon.png" alt="star icon" class="taskIcon">
                    Scale cube
                </div>
                <div class="taskBox">
                    <img src="/assets/ClockIcon.png" alt="clock icon" class="taskIcon">
                    00:01:00
                </div>
            </div>
        </div>
        <div class="overlay-edge lc-overlay-bottom">
            <div class="completeBtnsContainer">
                <button id="exit-button" class="completeBtn russo-one-regular">
                    <img src="/assets/ExitButton.png" alt="exit" class="completeBtnIcon">
                    Exit
                </button>
                <button id="retry-button" class="completeBtn russo-one-regular">
                    <img src="/assets/RetryButton.png" alt="retry" class="completeBtnIcon">
                    Retry
                </button>
                <button id="levels-button" class="completeBtn russo-one-regular">
                    <img src="/assets/LevelsButton.png" alt="levels" class="completeBtnIcon">
                    Levels
                </button>
                <button id="demo-button" class="completeBtn russo-one-regular">
                    <img src="/assets/DemoButton.png" alt="demo" class="completeBtnIcon">
                    Demo
                </button>
            </div>
        </div>
        <div class="overlay-edge lc-overlay-left"></div>

        <div class="lc-overlay-content"></div>
    </div>

</body>

</html>
